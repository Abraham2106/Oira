name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/architecture/check-boundaries.test.mjs
      - run: node scripts/architecture/check-boundaries.mjs
      - run: pnpm lint:desktop
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:self-check
      - run: pnpm --filter oira-desktop build
